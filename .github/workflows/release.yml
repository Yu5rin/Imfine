name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン番号 (例: v1.5.9)　空欄で ui.py から自動取得'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.version }}"
            if [ -z "$INPUT" ]; then
              VER=$(python -c "import re; m=re.search(r\"VERSION = '([^']+)'\", open('ui.py',encoding='utf-8').read()); print('v'+m.group(1))")
            else
              VER="$INPUT"
            fi
            echo "tag=$VER" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # 画面に出るバージョン (ui.py の VERSION。アプリ内でバージョンを持つのはここだけで、
      # 自動アップデートもこの値と tag_name を比べる) がタグとずれたまま配らないよう、
      # 一致しなければここで止める。v1.3.1 / v1.3.2 / v1.4.1 / v1.4.2 は ui.py を上げずに
      # タグだけ進めたため、画面には1つ前の版が出ていた。ずれた版は自動アップデートでも
      # 「古い」と判断され、起動のたびに同じ版を落とし直すことになる。
      # 既存のリリースとタグを消す手順 (手動実行時) より前に置き、止まっても何も壊さない。
      - name: Check tag matches app version
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          APP_VERSION=$(python -c "import re; m=re.search(r\"^VERSION = '([^']+)'\", open('ui.py',encoding='utf-8').read(), re.M); print(m.group(1) if m else '')")
          if [ -z "$APP_VERSION" ]; then
            echo "::error::ui.py から VERSION を読み取れません。「VERSION = 'X.Y.Z'」の行があるか確かめてください。"
            exit 1
          fi
          if [ "$TAG" != "v$APP_VERSION" ]; then
            echo "::error::タグ ($TAG) とアプリのバージョン (ui.py の VERSION = '$APP_VERSION') が一致しません。ui.py の VERSION を上げたコミットにタグを付けるか、バージョンの入力を v$APP_VERSION にしてください。"
            exit 1
          fi
          echo "タグとアプリのバージョンが一致: $TAG"

      - name: Check CHANGELOG entry
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES_PATH="$RUNNER_TEMP/release_notes.md"

          awk -v ver="## $TAG" '
            { sub(/\r$/, "") }
            $0 == ver { p = 1; next }
            p && /^## / { p = 0 }
            p { buf[++n] = $0 }
            END {
              s = 1; e = n
              while (s <= e && buf[s] == "") s++
              while (e >= s && buf[e] == "") e--
              for (i = s; i <= e; i++) print buf[i]
            }
          ' CHANGELOG.md > "$NOTES_PATH"

          if [ ! -s "$NOTES_PATH" ]; then
            echo "::error::CHANGELOG.md に「## $TAG」の節が見つかりません。リリース前に CHANGELOG.md へ該当バージョンの節を追記してから再実行してください。"
            exit 1
          fi

          echo "notes_path=$NOTES_PATH" >> $GITHUB_OUTPUT

      - name: Delete existing release and tag if present (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ steps.ver.outputs.tag }} --yes 2>/dev/null || true
          git push origin --delete ${{ steps.ver.outputs.tag }} 2>/dev/null || true

      - name: Create and push tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate icons
        run: python icon_gen.py

      - name: Build exe
        run: pyinstaller ImFine.spec

      # リリース本文は「## 変更点」と「## ダウンロード」の2節と、README への案内1行だけにする。
      # インストールや更新の方法、機能の説明は README に置き、リリースには書かない。
      # 自動アップデート (updater.py) は本文を読まず、tag_name と exe の assets
      # (digest / browser_download_url) だけを使うので、本文の形を変えても更新には影響しない。
      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          CHANGES="${{ steps.changelog.outputs.notes_path }}"
          EXE="dist/ImFine.exe"
          OUT="$RUNNER_TEMP/release_body.md"

          SIZE=$(stat -c %s "$EXE")
          SIZE_TEXT=$(awk -v s="$SIZE" 'BEGIN { if (s >= 1048576) printf "%.1f MB", s / 1048576; else printf "%.1f KB", s / 1024 }')
          SHA=$(sha256sum "$EXE" | cut -d ' ' -f 1)

          {
            echo "## 変更点"
            echo ""
            cat "$CHANGES"
            echo ""
            echo "## ダウンロード"
            echo ""
            echo "| ファイル | サイズ | SHA256 |"
            echo "| --- | --- | --- |"
            echo "| $(basename "$EXE") | $SIZE_TEXT | \`$SHA\` |"
            echo ""
            echo "インストールと更新の方法は [README](https://github.com/Yu5rin/Imfine#インストールと更新) をご覧ください。"
          } > "$OUT"

          echo "body_path=$OUT" >> $GITHUB_OUTPUT

      # 下書き（--draft）で作り、「変更点」を書き入れてから公開する。下書きは releases/latest に
      # 出ないので、公開するまで自動アップデートの対象にならず、仮の本文も人目に触れない。
      - name: Create release
        shell: bash
        run: gh release create ${{ steps.ver.outputs.tag }} dist/ImFine.exe --draft --title "${{ steps.ver.outputs.tag }}" --notes-file "${{ steps.notes.outputs.body_path }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
