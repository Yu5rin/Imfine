name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate icons
        run: python icon_gen.py

      - name: Build exe
        run: pyinstaller Mouser.spec

      - name: Create release
        run: gh release create ${{ github.ref_name }} dist/Mouser.exe --title "Mouser ${{ github.ref_name }}" --notes "Mouser ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
