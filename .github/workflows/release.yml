name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン番号 (例: v1.5.9)　空欄で ui.py から自動取得'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.version }}"
            if [ -z "$INPUT" ]; then
              VER=$(python -c "import re; m=re.search(r\"VERSION = '([^']+)'\", open('ui.py',encoding='utf-8').read()); print('v'+m.group(1))")
            else
              VER="$INPUT"
            fi
            echo "tag=$VER" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Check CHANGELOG entry
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES_PATH="$RUNNER_TEMP/release_notes.md"

          awk -v ver="## $TAG" '
            { sub(/\r$/, "") }
            $0 == ver { p = 1; next }
            p && /^## / { p = 0 }
            p { buf[++n] = $0 }
            END {
              s = 1; e = n
              while (s <= e && buf[s] == "") s++
              while (e >= s && buf[e] == "") e--
              for (i = s; i <= e; i++) print buf[i]
            }
          ' CHANGELOG.md > "$NOTES_PATH"

          if [ ! -s "$NOTES_PATH" ]; then
            echo "::error::CHANGELOG.md に「## $TAG」の節が見つかりません。リリース前に CHANGELOG.md へ該当バージョンの節を追記してから再実行してください。"
            exit 1
          fi

          echo "notes_path=$NOTES_PATH" >> $GITHUB_OUTPUT

      - name: Delete existing release and tag if present (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ steps.ver.outputs.tag }} --yes 2>/dev/null || true
          git push origin --delete ${{ steps.ver.outputs.tag }} 2>/dev/null || true

      - name: Create and push tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate icons
        run: python icon_gen.py

      - name: Build exe
        run: pyinstaller ImFine.spec

      - name: Create release
        shell: bash
        run: gh release create ${{ steps.ver.outputs.tag }} dist/ImFine.exe --title "I'm fine ${{ steps.ver.outputs.tag }}" --notes-file "${{ steps.changelog.outputs.notes_path }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
