name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン番号 (例: v1.5.9)　空欄で ui.py から自動取得'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.version }}"
            if [ -z "$INPUT" ]; then
              VER=$(python -c "import re,sys; m=re.search(r\"VERSION = '([^']+)'\", open('ui.py').read()); print('v'+m.group(1))")
            else
              VER="$INPUT"
            fi
            echo "tag=$VER" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate icons
        run: python icon_gen.py

      - name: Build exe
        run: pyinstaller Mouser.spec

      - name: Create release
        run: gh release create ${{ steps.ver.outputs.tag }} dist/Mouser.exe --title "Mouser ${{ steps.ver.outputs.tag }}" --notes "Mouser ${{ steps.ver.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
